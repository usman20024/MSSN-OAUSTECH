<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSSN OAUSTECH | Login</title>
        <link rel="shortcut icon" href="assets/images/mssn-logo.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="login">
    <div class="auth-shell pattern-bg">
      <div class="auth-card card glass-card">
        <div class="auth-brand">
          <!-- <div class="brand-mark">☪</div> -->
                       <span class="brand-mark">
              <img src="assets/images/mssn-logo.jpg" alt="MSSN logo" />
            </span>
          <div>
            <h1>MSSN OAUSTECH</h1>
            <p>Welcome back</p>
          </div>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="loginEmail">Email</label>
            <input
              id="loginEmail"
              name="email"
              type="email"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
            <small class="error-text" data-error-for="loginEmail"></small>
          </div>

          <div class="field-group password-wrap">
            <label for="loginPassword">Password</label>
            <input
              id="loginPassword"
              name="password"
              type="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
            <small class="error-text" data-error-for="loginPassword"></small>
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">
            <span class="btn-text">Login</span>
            <span class="spinner hidden"><i class="fa-solid fa-spinner fa-spin"></i></span>
          </button>

          <div id="authMessage" class="auth-message" aria-live="polite"></div>
        </form>

        <p class="auth-switch">
          Don’t have an account? <a href="register.html">Create account</a>
        </p>
        <p class="auth-footer-link"><a href="index.html">Back to home</a></p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>

      <main class="container section azkar-page">
        <section class="page-intro">
          <div>
            <span class="eyebrow">Daily remembrance</span>
            <h1>Azkar</h1>
          </div>
        </section>

        <div class="azkar-layout">
          <aside class="card category-panel">
            <h3>Categories</h3>
            <div id="azkarCategories" class="category-list"></div>
          </aside>
          <section class="card azkar-content">
            <div class="progress-strip">
              <span id="azkarProgressLabel">0 / 0</span>
              <div class="progress-bar"><span id="azkarCounterBar" style="width:0%"></span></div>
            </div>
            <div id="azkarItem" class="azkar-item"></div>
            <div class="azkar-controls">
              <button type="button" class="btn btn-secondary" id="prevAzkar">Previous</button>
              <button type="button" class="btn btn-primary" id="incrementAzkar">Tap count</button>
              <button type="button" class="btn btn-secondary" id="nextAzkar">Next</button>
            </div>
            <div class="azkar-actions">
              <button type="button" class="btn btn-ghost" id="resetAzkar">Reset</button>
            </div>
